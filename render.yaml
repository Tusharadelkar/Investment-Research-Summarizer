services:
  # 1. Managed Redis instance for the background worker queue
  - type: redis
    name: inv-research-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction

  # 2. The main application (runs both Web and Worker via honcho)
  - type: web
    name: inv-research-app
    env: docker
    plan: starter # Starter plan needed to support persistent disks
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: inv-research-redis
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      # API Keys must be provided in the Render Dashboard -> Environment Variables:
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: app-data
      mountPath: /data
      sizeGB: 1
